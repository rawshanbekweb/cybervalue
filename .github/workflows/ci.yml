name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production dependencies only; dev tooling advisories are tracked by Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cybervalue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI database and account; never production values.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/cybervalue
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-else
      E2E_ADMIN_EMAIL: e2e-admin@example.com
      E2E_ADMIN_PASSWORD: ci-only-admin-password
      E2E_ISOLATED_ACCOUNT: "true"
      E2E_HTML_ASSESSMENT: "true"
      PORT: "3100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: printf '%s\n' "$E2E_ADMIN_PASSWORD" | npm run admin:create-user -- --email "$E2E_ADMIN_EMAIL"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --workers=1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
